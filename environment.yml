name: paper0-atlas
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal=8.25
  - pandas=2.2
  # pyBigWig/deepTools are not yet compatible with NumPy 2 in the pinned stack.
  - numpy=1.26
  - scipy=1.14
  - matplotlib=3.9
  - seaborn=0.13
  - pyyaml=6
  - pysam=0.24
  - cutadapt=5.2
  - bowtie2=2.5.4
  - bowtie=1.3.1
  - samtools=1.21
  - bedtools=2.31.1
  - picard=3.3
  - trim-galore=0.6.10
  - macs3=3.0.2
  - genrich=0.6.1
  - deeptools=3.5.5
  - pybigwig=0.3.22
  - pytest=8.3
  - subread=2.0.6
  - pigz=2.8
  - curl=8
  - openssl
  - pip
